steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      persist-credentials: false

  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Unzip archive
    run: |
      set -euo pipefail
      ZIP_FILE="aio-school-completo(1).zip"
      if [ ! -f "$ZIP_FILE" ]; then
        echo "Arquivo $ZIP_FILE não encontrado na raiz do repo"
        exit 1
      fi
      rm -rf tmp_unzip
      mkdir -p tmp_unzip
      unzip -q "$ZIP_FILE" -d tmp_unzip

  - name: Run organizer script
    run: |
      chmod +x scripts/organize_aios.sh
      ./scripts/organize_aios.sh tmp_unzip aios_complete_01

  - name: Commit and push organized files to new branch using PAT
    env:
      GIT_AUTHOR_NAME: "github-actions[bot]"
      GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
    run: |
      set -euo pipefail
      git config user.name "$GIT_AUTHOR_NAME"
      git config user.email "$GIT_AUTHOR_EMAIL"
      BRANCH_NAME="organize/aios_complete_01"
      git fetch origin
      if git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
        git checkout $BRANCH_NAME
      else
        git checkout -b $BRANCH_NAME
      fi
      git add aios_complete_01 || true
      git commit -m "Extrai e organizou 'aio-school-completo' em aios_complete_01" || echo "Sem alterações para commitar"
      git remote set-url origin https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/${{ github.repository }}
      git push --set-upstream origin HEAD
